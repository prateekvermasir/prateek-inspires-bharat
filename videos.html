<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Watch the latest videos on geopolitics, defence, world affairs and India's global role from Prateek Inspires Bharat.">
  <title>All Videos | Prateek Inspires Bharat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;
    }

    header {
      background: #ff6900;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    nav {
      background: #111827;
      padding: 15px;
      text-align: center;
    }

    nav a {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin: 7px 10px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ff6900;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h2 {
      color: #ff7900;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #182337;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #29364b;
    }

    .video-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .video-card h3 {
      font-size: 16px;
      line-height: 1.5;
      padding: 0 14px;
    }

    .watch-btn {
      display: block;
      background: #ff6900;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      margin: 14px;
      border-radius: 6px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      color: #cbd5e1;
      padding: 20px;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #cbd5e1;
      background: #111827;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎥 Prateek Inspires Bharat</h1>
    <p>Geopolitics · Defence · World Affairs</p>
  </header>

  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="analysis.html">📚 Analysis &amp; Insights</a>
  </nav>

  <main>
    <section class="intro">
      <h2>🎬 All YouTube Videos</h2>
      <p>Explore videos on India's strategic affairs, geopolitics, defence and global developments.</p>
    </section>

    <section class="video-grid" id="videoGrid">
      <p class="message">Loading videos...</p>
    </section>

    <p class="message" id="status"></p>
  </main>

  <footer>
    <p>© 2026 Prateek Inspires Bharat. All Rights Reserved.</p>
  </footer>

  <script>
    const channelId = "UCfgBND0NySE4l3msTsrmg1w";
    const feedUrl =
      "https://www.youtube.com/feeds/videos.xml?channel_id=" + channelId;

    const grid = document.getElementById("videoGrid");
    const status = document.getElementById("status");

    async function loadVideos() {
      try {
        const response = await fetch(
          "https://api.rss2json.com/v1/api.json?rss_url=" +
          encodeURIComponent(feedUrl)
        );

        if (!response.ok) {
          throw new Error("Feed request failed");
        }

        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          throw new Error("No videos found");
        }

        grid.innerHTML = "";

        data.items.forEach(video => {
          const videoId = video.guid.split(":").pop();
          const thumbnail =
            video.thumbnail ||
            "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";

          const card = document.createElement("article");
          card.className = "video-card";

          const image = document.createElement("img");
          image.src = thumbnail;
          image.alt = video.title || "YouTube video thumbnail";
          image.loading = "lazy";

          const title = document.createElement("h3");
          title.textContent = video.title || "YouTube Video";

          const link = document.createElement("a");
          link.className = "watch-btn";
          link.href = "https://www.youtube.com/watch?v=" + videoId;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "▶ Watch Video";

          card.appendChild(image);
          card.appendChild(title);
          card.appendChild(link);
          grid.appendChild(card);
        });

        status.textContent =
          "Showing the latest videos from the YouTube channel.";

      } catch (error) {
        grid.innerHTML = `
          <div class="video-card">
            <h3>Watch All Videos on YouTube</h3>
            <p style="padding: 0 14px;">
              Videos could not be loaded automatically right now.
              You can visit our official channel to watch them.
            </p>
            <a class="watch-btn"
               href="https://www.youtube.com/@PrateekInspiresBharat/videos"
               target="_blank"
               rel="noopener noreferrer">
              ▶ Visit YouTube Channel
            </a>
          </div>
        `;

        status.textContent =
          "Automatic loading may be temporarily unavailable.";
      }
    }

    loadVideos();
  </script>
</body>
</html>
